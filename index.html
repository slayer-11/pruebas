<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBlog</title>
    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        p {
            font-style: italic;
            color: #666;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 600px;
        }

        th, td {
            padding: 12px 20px;
            border: 1px solid #ccc;
        }

        th {
            background-color: #e0e0e0;
        }

        img {
            display: block;
            margin: 10px auto;
            border-radius: 8px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .social-icons a {
            text-decoration: none;
            color: white;
            background-color: #0077cc;
            padding: 10px;
            border-radius: 50%;
            font-size: 20px;
            transition: background-color 0.3s;
        }

        .social-icons a:hover {
            background-color: #005fa3;
        }

        .github-profile {
            margin-top: 30px;
        }

        .github-profile img {
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .github-profile a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .github-profile a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Bienvenido a Mi Blog</h1>
    <p>Después del fracaso viene el éxito.</p>

        </tr>
        <tr>
            <th>Redes Sociales</th>
            <td>
                <div class="social-icons">
                    <a href="https://www.facebook.com/lizeth.martinezmontelongo" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/lizgpe_mtz/" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://x.com/LizethMart63999" target="_blank"><i class="fab fa-twitter"></i></a>
                </div>
            </td>
        </tr>
    </table>
